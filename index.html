<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
</head>
<body>
    <div class="elige-tu-orden">
        <div class="estado-de-iphone">
            <div class="div">9:41</div>
            <div class="dynamic-island"></div>
            <div class="div2">▴ ▰</div>
        </div>
        <div class="encabezado">
            <b class="utd-food">UTD FOOD</b>
            <b class="elige-tu-orden2">Elige tu orden</b>
        </div>
        <div class="pedido">
            <div class="tu-antojo-a">Tu antojo, a un toque de distancia.</div>
            <div class="gorditas-utd" data-product data-price="150" data-name="Gorditas UTD">
                <div class="icono-de-gorditas">
                    <img class="icono-de-gorditas-vector" alt="" src="img/gordita.svg">

                </div>
                <div class="detalles">
                    <div class="gorditas-utd2">Gorditas UTD</div>
                    <div class="una-orden-de">Orden de 5 gorditas</div>
                    <div class="precio">
                        <b class="b" data-unit-price>$150</b>
                        <div class="mxn">MXN</div>
                    </div>
                </div>
                <div class="cantidad">
                    <button class="productos quantity-button" type="button" data-action="decrease" aria-label="Reducir Gorditas UTD">−</button>
                    <div class="div4" data-quantity>0</div>
                    <button class="productos quantity-button" type="button" data-action="increase" aria-label="Agregar Gorditas UTD">+</button>
                </div>
            </div>
            <div class="gorditas-utd" data-product data-price="350" data-name="Tacos UTD">
                <div class="icono-de-tacos">
                    <img class="icono-de-gorditas-vector" alt="" src="img/taco.svg">

                </div>
                <div class="detalles">
                    <div class="gorditas-utd2">Tacos UTD</div>
                    <div class="una-orden-de">Una orden de tacos</div>
                    <div class="precio">
                        <b class="b" data-unit-price>$350</b>
                        <div class="mxn">MXN</div>
                    </div>
                </div>
                <div class="cantidad">
                    <button class="productos quantity-button" type="button" data-action="decrease" aria-label="Reducir Tacos UTD">−</button>
                    <div class="div4" data-quantity>0</div>
                    <button class="productos quantity-button" type="button" data-action="increase" aria-label="Agregar Tacos UTD">+</button>
                </div>
            </div>
            <div class="gorditas-utd" data-product data-price="5" data-name="Uber Eats">
                <div class="icono-de-bolsa-de-compra">
                    <img class="icono-de-gorditas-vector" alt="" src="img/uber.svg">

                </div>
                <div class="detalles">
                    <div class="gorditas-utd2">Uber Eats</div>
                    <div class="una-orden-de">Crédito para tu pedido</div>
                    <div class="precio">
                        <b class="b" data-unit-price>$5</b>
                        <div class="mxn">MXN</div>
                    </div>
                </div>
                <div class="cantidad">
                    <button class="productos quantity-button" type="button" data-action="decrease" aria-label="Reducir Uber Eats">−</button>
                    <div class="div4" data-quantity>0</div>
                    <button class="productos quantity-button" type="button" data-action="increase" aria-label="Agregar Uber Eats">+</button>
                </div>
            </div>
        </div>
        <div class="accin-principal">
            <div class="total-del-pedido">
                <div class="productos" data-product-count>0 productos</div>
                <b class="mxn4" data-order-total>$0 MXN</b>
            </div>
            <button class="ver-mi-orden" type="button" data-review-order>
                <span class="ver-mi-orden2">Ver mi orden →</span>
            </button>
            <div class="revisa-tu-pedido" data-review-message>Revisa tu pedido antes de pagar</div>
            <div class="indicador-de-inicio">
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
