
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integración de 3 Botones - Mercado Pago</title>

  <!-- SDK oficial de Mercado Pago v2 -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .pricing-container { display: flex; gap: 20px; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 220px; text-align: center; }
    .card h3 { color: #333; margin-bottom: 10px; }
    .price { font-size: 24px; color: #009ee3; font-weight: bold; margin-bottom: 20px; }
    .btn-pagar { background-color: #009ee3; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-pagar:hover { background-color: #0073a8; }
  </style>
</head>
<body>

  <div class="pricing-container">
    <!-- Botón 1 -->
    <div class="card">
      <h3>GORDITAS UTD</h3>
      <div class="price">$150 MXN</div>
      <button class="btn-pagar" onclick="iniciarPago('Pagar por 5 gorditas cafeteria UTD:', 150)">Comprar Ahora</button>
    </div>

    <!-- Botón 2 -->
    <div class="card">
      <h3>TACOS UTD</h3>
      <div class="price">$350 MXN</div>
      <button class="btn-pagar" onclick="iniciarPago('Pagar por una orden de tacos fuera de la UTD:', 350)">Comprar Ahora</button>
    </div>

    <!-- Botón 3 -->
    <div class="card">
      <h3>UBER EATS</h3>
      <div class="price">$700</div>
      <button class="btn-pagar" onclick="iniciarPago('Pagar por uber EATS', 700)">Comprar Ahora</button>
    </div>
  </div>

  <script>
    // Inicializa el SDK de Mercado Pago con tu Public Key
    const mp = new MercadoPago('XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX', {
      locale: 'es-MX' // Cambia el código de acuerdo a tu país (es-AR, es-CO, etc.)
    });

    async function iniciarPago(titulo, precio) {
      try {
        // 1. Solicita la preferencia al servidor backend
        const response = await fetch('http://localhost:3000/create_preference', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: titulo,
            price: precio
          })
        });

        const data = await response.json();

        if (data.id) {
          // 2. Abre el Checkout Pro de Mercado Pago de manera interactiva
          mp.checkout({
            preference: {
              id: data.id
            },
            autoOpen: true // Abre el flujo de pago automáticamente al hacer clic
          });
        } else {
          alert('Error al generar el pago. Intenta nuevamente.');
        }

      } catch (error) {
        console.error('Error de red o conexión con el servidor:', error);
      }
    }
  </script>
</body>
</html>
